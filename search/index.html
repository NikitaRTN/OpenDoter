<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск</title>
    <link rel="stylesheet" href="/css/root.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/header.css">
    <link rel="stylesheet" href="/css/overview.css">
</head>
<body>
<div class="container">
    <header class="site-topbar">
        <a class="brand-link" href="/">OpenDoter</a>
        <form class="global-search" action="/search" method="get">
            <input type="search" name="q" placeholder="Найти игрока или Match ID" data-search-input>
            <button type="submit">Найти</button>
        </form>
    </header>

    <section class="profile-panel">
        <div class="team-header">
            <div>
                <span class="team-title">Поиск</span>
                <span class="team-subtitle"> - игроки и матчи</span>
            </div>
        </div>

        <div data-search-results>
            <div class="empty-state">Загрузка...</div>
        </div>
    </section>
</div>
<script src="/src/assets/search.js"></script>
</body>
</html>
